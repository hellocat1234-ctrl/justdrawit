<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: ใช้พื้นที่เต็มจอ (ขอบ/รอยบากจัดการด้วย env(safe-area-inset-*) ใน theme.css) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6b5bff" />

    <!-- เพิ่มไปยังหน้าจอโฮม (Safari: แชร์ → เพิ่มไปยังหน้าจอโฮม) แล้วเปิดแบบเต็มจอไม่มีแถบเบราว์เซอร์
         iOS ใช้ meta apple-* + apple-touch-icon · Android/Chrome ใช้ manifest (display: standalone) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Just Drawit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Just Drawit</title>

    <!-- ฟอนต์ (ดู DESIGN.md หัวข้อ "ธีม Neo-Arcade")
         หัวข้อ ป้าย ปุ่ม ตัวเลข = Space Grotesk (อังกฤษ/เลข) + Chakra Petch (ไทย)
         ข้อความทั่วไป แชท = Rubik (อังกฤษ) + Prompt (ไทย)
         Jersey 15 ยังโหลดไว้ เผื่อปิดธีมใหม่กลับไปใช้ธีมพิกเซลเดิม -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;700&family=Rubik:wght@400;500;600&family=Jersey+15&family=Chakra+Petch:wght@500;600;700&family=Prompt:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
